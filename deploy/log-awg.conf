; Copy to /etc/supervisor/conf.d/log-awg.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start log-awg
;
; Secrets (DATABASE_URL) live only in /var/www/log-awg/env (chmod 600, root-only),
; never in this file — the shell wrapper below sources it before exec'ing the binary.

[program:log-awg]
command=/bin/sh -c 'set -a; . /var/www/log-awg/env; set +a; exec /var/www/log-awg/log-awg'
directory=/var/www/log-awg
user=root
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/log-awg.out.log
stderr_logfile=/var/log/log-awg.err.log
